<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标管理系统</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 指标管理系统</h1>
            <p>业务分析指标配置与管理平台</p>
        </div>
        
        <div class="nav">
            <div class="nav-links">
                <a href="index.html" class="active">📊 指标管理</a>
                <a href="admin.html" id="adminLink" style="display: none;">🔧 系统管理</a>
            </div>
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="currentUser"></span>
                <select id="topicSelect">
                    <option value="">所有主题</option>
                </select>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- 搜索和列表区域 -->
            <div class="form-section">
                <h2>指标列表</h2>
                <div class="search-bar">
                    <input type="text" id="searchKeyword" placeholder="搜索指标名称、编码、数据源、业务口径或负责人...">
                    <button class="btn btn-primary" onclick="searchMetrics()">搜索</button>
                    <button class="btn btn-secondary" onclick="loadMetrics()">刷新</button>
                    <button type="button" id="btnAddMetric" class="btn btn-primary btn-add-metric" onclick="openCreateModal()" style="display: none;">新增指标</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>指标名称</th>
                                <th>指标编码</th>
                                <th>业务口径</th>
                                <th>统计周期</th>
                                <th>主题域</th>
                                <th>数据源</th>
                                <th>负责人</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="metricTableBody">
                            <tr>
                                <td colspan="11" style="text-align: center; padding: 30px;">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/编辑指标弹窗 -->
    <div id="metricModal" class="modal" onclick="handleModalBackdropClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeMetricModal()">&times;</span>
            <h2 id="formTitle">新增指标</h2>

            <form id="metricForm">
                <input type="hidden" id="metricId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="metricName">指标名称 *</label>
                        <input type="text" id="metricName" required placeholder="请输入指标名称（唯一）">
                    </div>

                    <div class="form-group">
                        <label for="metricCode">指标编码 *</label>
                        <input type="text" id="metricCode" required placeholder="请输入指标编码（唯一）">
                    </div>
                </div>

                <div class="form-group">
                    <label for="businessCaliber">业务口径 *</label>
                    <textarea id="businessCaliber" rows="3" required placeholder="请描述指标的业务统计口径"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="topicId">所属主题域 *</label>
                        <select id="topicId" required>
                            <option value="">请选择主题域</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="statPeriod">统计周期</label>
                        <select id="statPeriod">
                            <option value="">不设置</option>
                            <option value="DAY">日</option>
                            <option value="MONTH">月</option>
                            <option value="WEEK">周</option>
                            <option value="REALTIME">实时</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="owner">负责人 *</label>
                        <input type="text" id="owner" required placeholder="请输入负责人">
                    </div>

                    <div class="form-group">
                        <label for="status">状态 *</label>
                        <select id="status" required>
                            <option value="ACTIVE">启用</option>
                            <option value="DRAFT">草稿</option>
                            <option value="DISABLED">停用</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataSource">数据源 <span id="dataSourceRequiredMark">*</span></label>
                        <input type="text" id="dataSource" placeholder="例如：vectordb、report_dw">
                    </div>
                </div>

                <div class="form-group">
                    <label for="sqlTemplate">SQL模版 <span id="sqlTemplateRequiredMark">*</span></label>
                    <textarea id="sqlTemplate" rows="6" placeholder="请输入 SQL 模版，可使用 ${paramName} 作为参数占位符&#10;例如：SELECT city, COUNT(*) AS cnt FROM orders WHERE order_date &gt;= ${startDate} GROUP BY city" style="font-family: 'Courier New', monospace; font-size: 13px;"></textarea>
                </div>

                <div class="form-group">
                    <label>参数定义</label>
                    <div class="param-editor">
                        <div class="param-editor-hint">点击「添加参数」手动新增参数，并在右侧填写说明</div>
                        <div class="param-list-header">
                            <span>参数名</span>
                            <span>说明</span>
                            <span>操作</span>
                        </div>
                        <div id="paramList"></div>
                        <button type="button" class="btn-add-param" onclick="addParamRow()">+ 添加参数</button>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closeMetricModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/metrics';
        const AUTH_API = 'http://localhost:8080/api/auth';
        const TOPIC_API = 'http://localhost:8080/api/topics';
        let currentUser = null;
        let allTopics = [];
        let paramList = [];

        function createParamItem(name, description, type, required) {
            return {
                name: name || '',
                description: description || '',
                type: type || 'string',
                required: required !== false
            };
        }

        function renderParamList() {
            const container = document.getElementById('paramList');
            if (!paramList.length) {
                container.innerHTML = '<div class="param-empty">暂无参数，点击「添加参数」新增</div>';
                return;
            }

            container.innerHTML = paramList.map((param, index) => `
                <div class="param-row">
                    <input type="text" value="${escapeHtml(param.name)}" placeholder="参数名，如 AAA"
                        oninput="updateParamField(${index}, 'name', this.value)">
                    <input type="text" value="${escapeHtml(param.description)}" placeholder="参数说明"
                        oninput="updateParamField(${index}, 'description', this.value)">
                    <button type="button" class="btn-remove-param" onclick="removeParamRow(${index})">删除</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function updateParamField(index, field, value) {
            if (paramList[index]) {
                paramList[index][field] = value;
            }
        }

        function addParamRow(name, description) {
            paramList.push(createParamItem(name || '', description || ''));
            renderParamList();
        }

        function removeParamRow(index) {
            paramList.splice(index, 1);
            renderParamList();
        }

        function loadParamsFromJson(json) {
            paramList = [];
            if (!json || !json.trim()) {
                renderParamList();
                return;
            }

            try {
                const parsed = JSON.parse(json);
                if (Array.isArray(parsed)) {
                    paramList = parsed.map(item => createParamItem(
                        item.name,
                        item.description,
                        item.type,
                        item.required
                    ));
                }
            } catch (e) {
                console.warn('参数定义 JSON 解析失败:', e);
            }
            renderParamList();
        }

        function serializeParams() {
            const validParams = paramList
                .map(p => ({
                    name: (p.name || '').trim(),
                    description: (p.description || '').trim(),
                    type: p.type || 'string',
                    required: p.required !== false
                }))
                .filter(p => p.name);

            return validParams.length ? JSON.stringify(validParams) : null;
        }

        function resetParamEditor() {
            paramList = [];
            renderParamList();
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            setTimeout(() => {
                msgDiv.className = 'message';
            }, 3000);
        }

        function getStatPeriodText(period) {
            const map = { DAY: '日', MONTH: '月', WEEK: '周', REALTIME: '实时' };
            return period ? (map[period] || period) : '-';
        }

        function getStatusText(status) {
            const map = { DRAFT: '草稿', ACTIVE: '启用', DISABLED: '停用' };
            return map[status] || status || '-';
        }

        function getStatusClass(status) {
            const map = { DRAFT: 'draft', ACTIVE: 'active', DISABLED: 'disabled' };
            return map[status] || 'draft';
        }

        // 加载所有指标
        async function loadMetrics() {
            try {
                const response = await fetch(API_BASE, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        // 搜索指标
        async function searchMetrics() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            
            if (!keyword) {
                loadMetrics();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/search?keyword=${encodeURIComponent(keyword)}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('搜索失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        function truncateText(text, maxLength) {
            if (!text) return '-';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // 渲染指标表格
        function renderMetricTable(metrics) {
            const tbody = document.getElementById('metricTableBody');
            
            if (!metrics || metrics.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 30px;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = metrics.map(metric => `
                <tr>
                    <td>${metric.id}</td>
                    <td>${metric.metricName}</td>
                    <td>${metric.metricCode || '-'}</td>
                    <td title="${metric.businessCaliber || ''}">${truncateText(metric.businessCaliber, 30)}</td>
                    <td>${getStatPeriodText(metric.statPeriod)}</td>
                    <td>${metric.topicName || '-'}</td>
                    <td>${metric.dataSource || '-'}</td>
                    <td>${metric.owner || '-'}</td>
                    <td>
                        <span class="badge badge-${getStatusClass(metric.status)}">
                            ${getStatusText(metric.status)}
                        </span>
                    </td>
                    <td>${new Date(metric.createdTime).toLocaleString('zh-CN')}</td>
                    <td>
                        ${canEdit() ? `<button class="btn btn-edit" onclick="editMetric(${metric.id})">编辑</button>` : ''}
                        ${canEdit() ? `<button class="btn btn-danger" onclick="deleteMetric(${metric.id})">删除</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function openMetricModal() {
            document.getElementById('metricModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeMetricModal() {
            document.getElementById('metricModal').classList.remove('show');
            document.body.style.overflow = '';
            resetForm();
        }

        function handleModalBackdropClick(event) {
            if (event.target.id === 'metricModal') {
                closeMetricModal();
            }
        }

        function openCreateModal() {
            resetForm();
            document.getElementById('formTitle').textContent = '新增指标';
            openMetricModal();
        }

        function fillMetricForm(metric) {
            document.getElementById('metricId').value = metric.id;
            document.getElementById('metricName').value = metric.metricName;
            document.getElementById('metricCode').value = metric.metricCode || '';
            document.getElementById('businessCaliber').value = metric.businessCaliber || '';
            document.getElementById('topicId').value = metric.topicId || '';
            document.getElementById('statPeriod').value = metric.statPeriod || '';
            document.getElementById('owner').value = metric.owner || '';
            document.getElementById('status').value = metric.status || 'ACTIVE';
            document.getElementById('dataSource').value = metric.dataSource || '';
            document.getElementById('sqlTemplate').value = metric.sqlTemplate || '';
            loadParamsFromJson(metric.paramDefinition || '');
            updateSqlFieldsRequired();
        }

        async function editMetric(id) {
            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (result.success) {
                    fillMetricForm(result.data);
                    document.getElementById('formTitle').textContent = '编辑指标';
                    openMetricModal();
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        // 删除指标
        async function deleteMetric(id) {
            if (!confirm('确定要删除这个指标吗？')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    showMessage('删除成功', 'success');
                    loadMetrics();
                } else {
                    showMessage('删除失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        function updateSqlFieldsRequired() {
            const isDraft = document.getElementById('status').value === 'DRAFT';
            const markDisplay = isDraft ? 'none' : 'inline';
            document.getElementById('dataSourceRequiredMark').style.display = markDisplay;
            document.getElementById('sqlTemplateRequiredMark').style.display = markDisplay;
        }

        document.getElementById('status').addEventListener('change', updateSqlFieldsRequired);

        // 重置表单
        function resetForm() {
            document.getElementById('metricForm').reset();
            document.getElementById('metricId').value = '';
            document.getElementById('status').value = 'ACTIVE';
            document.getElementById('formTitle').textContent = '新增指标';
            resetParamEditor();
            updateSqlFieldsRequired();
        }

        // 提交表单
        document.getElementById('metricForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('metricId').value;
            const topicId = document.getElementById('topicId').value;
            const statPeriod = document.getElementById('statPeriod').value;
            const metricData = {
                metricName: document.getElementById('metricName').value.trim(),
                metricCode: document.getElementById('metricCode').value.trim(),
                businessCaliber: document.getElementById('businessCaliber').value.trim(),
                topicId: topicId ? parseInt(topicId) : null,
                statPeriod: statPeriod || null,
                owner: document.getElementById('owner').value.trim(),
                status: document.getElementById('status').value,
                dataSource: document.getElementById('dataSource').value.trim(),
                sqlTemplate: document.getElementById('sqlTemplate').value.trim(),
                paramDefinition: serializeParams()
            };

            try {
                const url = id ? `${API_BASE}/${id}` : API_BASE;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(metricData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(id ? '更新成功' : '创建成功', 'success');
                    closeMetricModal();
                    loadMetrics();
                } else {
                    showMessage('操作失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        });

        // 页面加载时获取数据
        window.addEventListener('load', async function() {
            renderParamList();
            updateSqlFieldsRequired();
            await checkLogin();
            if (currentUser) {
                await loadTopics();
                loadMetrics();
                updateUI();
            }
        });
        
        // 检查登录状态
        async function checkLogin() {
            try {
                const response = await fetch(`${AUTH_API}/current`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.data;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                } else {
                    // 未登录,跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                window.location.href = 'login.html';
            }
        }
        
        // 加载主题列表
        async function loadTopics() {
            try {
                const response = await fetch(TOPIC_API, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    allTopics = result.data;
                    
                    // 填充表单中的主题选择器
                    const topicSelect = document.getElementById('topicId');
                    topicSelect.innerHTML = '<option value="">请选择主题</option>' + 
                        allTopics.map(topic => `<option value="${topic.id}">${topic.topicName}</option>`).join('');
                    
                    // 填充导航栏中的主题选择器
                    const navTopicSelect = document.getElementById('topicSelect');
                    navTopicSelect.innerHTML = '<option value="">所有主题</option>' + 
                        allTopics.map(topic => `<option value="${topic.id}">${topic.topicName}</option>`).join('');
                    
                    // 监听主题筛选
                    navTopicSelect.addEventListener('change', function() {
                        const topicId = this.value;
                        if (topicId) {
                            loadMetricsByTopic(topicId);
                        } else {
                            loadMetrics();
                        }
                    });
                }
            } catch (error) {
                console.error('加载主题失败:', error);
            }
        }
        
        // 根据主题加载指标
        async function loadMetricsByTopic(topicId) {
            try {
                const response = await fetch(`${API_BASE}/topic/${topicId}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 更新UI
        function updateUI() {
            if (!currentUser) return;
            
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('currentUser').textContent = 
                `${currentUser.realName || currentUser.username} (${getRoleText(currentUser.role)})`;
            
            // 显示管理员链接
            if (currentUser.role === 'SUPER_ADMIN') {
                document.getElementById('adminLink').style.display = 'inline';
            }
            
            const addBtn = document.getElementById('btnAddMetric');
            if (canEdit()) {
                addBtn.style.display = 'inline-block';
            } else {
                addBtn.style.display = 'none';
                showMessage('您当前只有查看权限，如需编辑请联系管理员', 'error');
            }
        }
        
        // 获取角色文本
        function getRoleText(role) {
            const roleMap = {
                'SUPER_ADMIN': '超级管理员',
                'TOPIC_ADMIN': '主题管理员',
                'USER': '普通用户'
            };
            return roleMap[role] || role;
        }
        
        // 检查是否有编辑权限
        function canEdit() {
            if (!currentUser) return false;
            return currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'TOPIC_ADMIN';
        }
        
        // 退出登录
        async function logout() {
            try {
                await fetch(`${AUTH_API}/logout`, { 
                    method: 'POST',
                    credentials: 'include'
                });
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('退出失败:', error);
            }
        }

    </script>
</body>
</html>
