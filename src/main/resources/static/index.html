<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .nav {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-links a {
            margin-right: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .nav-links a:hover {
            text-decoration: underline;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-info span {
            color: #666;
            font-size: 14px;
        }
        
        .btn-logout {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-edit {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: #d4edda;
            color: #155724;
        }

        .badge-draft {
            background: #fff3cd;
            color: #856404;
        }

        .badge-disabled {
            background: #f8d7da;
            color: #721c24;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .array-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .array-input input {
            flex: 1;
        }

        .add-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .item-list {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
            min-height: 50px;
        }

        .item-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            margin: 3px;
            font-size: 12px;
        }

        .item-tag .remove {
            margin-left: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #000;
        }

        .btn-generate {
            background: #ff9800;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 指标管理系统</h1>
            <p>业务分析指标配置与管理平台</p>
        </div>
        
        <div class="nav">
            <div class="nav-links">
                <a href="index.html" style="color: #764ba2; font-weight: bold;">📊 指标管理</a>
                <a href="admin.html" id="adminLink" style="display: none;">🔧 系统管理</a>
            </div>
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="currentUser"></span>
                <select id="topicSelect" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #e0e0e0;">
                    <option value="">所有主题</option>
                </select>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- 表单区域 -->
            <div class="form-section">
                <h2 id="formTitle">新增指标</h2>

                <form id="metricForm">
                    <input type="hidden" id="metricId">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="metricName">指标名称 *</label>
                            <input type="text" id="metricName" required placeholder="请输入指标名称（唯一）">
                        </div>

                        <div class="form-group">
                            <label for="metricCode">指标编码 *</label>
                            <input type="text" id="metricCode" required placeholder="请输入指标编码（唯一）">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="businessCaliber">业务口径 *</label>
                        <textarea id="businessCaliber" rows="3" required placeholder="请描述指标的业务统计口径"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="topicId">所属主题域 *</label>
                            <select id="topicId" required>
                                <option value="">请选择主题域</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="statPeriod">统计周期</label>
                            <select id="statPeriod">
                                <option value="">不设置</option>
                                <option value="DAY">日</option>
                                <option value="MONTH">月</option>
                                <option value="WEEK">周</option>
                                <option value="REALTIME">实时</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="owner">负责人 *</label>
                            <input type="text" id="owner" required placeholder="请输入负责人">
                        </div>

                        <div class="form-group">
                            <label for="status">状态 *</label>
                            <select id="status" required>
                                <option value="ACTIVE">启用</option>
                                <option value="DRAFT">草稿</option>
                                <option value="DISABLED">停用</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dataSource">数据源 <span id="dataSourceRequiredMark">*</span></label>
                            <input type="text" id="dataSource" placeholder="例如：vectordb、report_dw">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="sqlTemplate">SQL模版 <span id="sqlTemplateRequiredMark">*</span></label>
                        <textarea id="sqlTemplate" rows="6" placeholder="请输入 SQL 模版，可使用 ${paramName} 作为参数占位符&#10;例如：SELECT city, COUNT(*) AS cnt FROM orders WHERE order_date &gt;= ${startDate} GROUP BY city" style="font-family: 'Courier New', monospace; font-size: 13px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="paramDefinition">参数定义</label>
                        <textarea id="paramDefinition" rows="5" placeholder='JSON 格式，例如：&#10;[&#10;  {"name":"startDate","type":"date","required":true,"description":"开始日期"},&#10;  {"name":"city","type":"string","required":false,"description":"城市"}&#10;]' style="font-family: 'Courier New', monospace; font-size: 13px;"></textarea>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
                    </div>
                </form>
            </div>

            <!-- 搜索和列表区域 -->
            <div class="form-section">
                <h2>指标列表</h2>
                <div class="search-bar">
                    <input type="text" id="searchKeyword" placeholder="搜索指标名称、编码、数据源、业务口径或负责人...">
                    <button class="btn btn-primary" onclick="searchMetrics()">搜索</button>
                    <button class="btn btn-secondary" onclick="loadMetrics()">刷新</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>指标名称</th>
                                <th>指标编码</th>
                                <th>业务口径</th>
                                <th>统计周期</th>
                                <th>主题域</th>
                                <th>数据源</th>
                                <th>负责人</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="metricTableBody">
                            <tr>
                                <td colspan="11" style="text-align: center; padding: 30px;">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/metrics';
        const AUTH_API = 'http://localhost:8080/api/auth';
        const TOPIC_API = 'http://localhost:8080/api/topics';
        let currentUser = null;
        let allTopics = [];

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            setTimeout(() => {
                msgDiv.className = 'message';
            }, 3000);
        }

        function getStatPeriodText(period) {
            const map = { DAY: '日', MONTH: '月', WEEK: '周', REALTIME: '实时' };
            return period ? (map[period] || period) : '-';
        }

        function getStatusText(status) {
            const map = { DRAFT: '草稿', ACTIVE: '启用', DISABLED: '停用' };
            return map[status] || status || '-';
        }

        function getStatusClass(status) {
            const map = { DRAFT: 'draft', ACTIVE: 'active', DISABLED: 'disabled' };
            return map[status] || 'draft';
        }

        // 加载所有指标
        async function loadMetrics() {
            try {
                const response = await fetch(API_BASE, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        // 搜索指标
        async function searchMetrics() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            
            if (!keyword) {
                loadMetrics();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/search?keyword=${encodeURIComponent(keyword)}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('搜索失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        function truncateText(text, maxLength) {
            if (!text) return '-';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // 渲染指标表格
        function renderMetricTable(metrics) {
            const tbody = document.getElementById('metricTableBody');
            
            if (!metrics || metrics.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 30px;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = metrics.map(metric => `
                <tr>
                    <td>${metric.id}</td>
                    <td>${metric.metricName}</td>
                    <td>${metric.metricCode || '-'}</td>
                    <td title="${metric.businessCaliber || ''}">${truncateText(metric.businessCaliber, 30)}</td>
                    <td>${getStatPeriodText(metric.statPeriod)}</td>
                    <td>${metric.topicName || '-'}</td>
                    <td>${metric.dataSource || '-'}</td>
                    <td>${metric.owner || '-'}</td>
                    <td>
                        <span class="badge badge-${getStatusClass(metric.status)}">
                            ${getStatusText(metric.status)}
                        </span>
                    </td>
                    <td>${new Date(metric.createdTime).toLocaleString('zh-CN')}</td>
                    <td>
                        ${canEdit() ? `<button class="btn btn-edit" onclick="editMetric(${metric.id})">编辑</button>` : ''}
                        ${canEdit() ? `<button class="btn btn-danger" onclick="deleteMetric(${metric.id})">删除</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        async function editMetric(id) {
            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (result.success) {
                    const metric = result.data;
                    document.getElementById('metricId').value = metric.id;
                    document.getElementById('metricName').value = metric.metricName;
                    document.getElementById('metricCode').value = metric.metricCode || '';
                    document.getElementById('businessCaliber').value = metric.businessCaliber || '';
                    document.getElementById('topicId').value = metric.topicId || '';
                    document.getElementById('statPeriod').value = metric.statPeriod || '';
                    document.getElementById('owner').value = metric.owner || '';
                    document.getElementById('status').value = metric.status || 'ACTIVE';
                    document.getElementById('dataSource').value = metric.dataSource || '';
                    document.getElementById('sqlTemplate').value = metric.sqlTemplate || '';
                    document.getElementById('paramDefinition').value = metric.paramDefinition || '';
                    document.getElementById('formTitle').textContent = '编辑指标';
                    updateSqlFieldsRequired();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        // 删除指标
        async function deleteMetric(id) {
            if (!confirm('确定要删除这个指标吗？')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    showMessage('删除成功', 'success');
                    loadMetrics();
                } else {
                    showMessage('删除失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }

        function updateSqlFieldsRequired() {
            const isDraft = document.getElementById('status').value === 'DRAFT';
            const markDisplay = isDraft ? 'none' : 'inline';
            document.getElementById('dataSourceRequiredMark').style.display = markDisplay;
            document.getElementById('sqlTemplateRequiredMark').style.display = markDisplay;
        }

        document.getElementById('status').addEventListener('change', updateSqlFieldsRequired);

        // 重置表单
        function resetForm() {
            document.getElementById('metricForm').reset();
            document.getElementById('metricId').value = '';
            document.getElementById('status').value = 'ACTIVE';
            document.getElementById('formTitle').textContent = '新增指标';
            updateSqlFieldsRequired();
        }

        // 提交表单
        document.getElementById('metricForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('metricId').value;
            const topicId = document.getElementById('topicId').value;
            const statPeriod = document.getElementById('statPeriod').value;
            const metricData = {
                metricName: document.getElementById('metricName').value.trim(),
                metricCode: document.getElementById('metricCode').value.trim(),
                businessCaliber: document.getElementById('businessCaliber').value.trim(),
                topicId: topicId ? parseInt(topicId) : null,
                statPeriod: statPeriod || null,
                owner: document.getElementById('owner').value.trim(),
                status: document.getElementById('status').value,
                dataSource: document.getElementById('dataSource').value.trim(),
                sqlTemplate: document.getElementById('sqlTemplate').value.trim(),
                paramDefinition: document.getElementById('paramDefinition').value.trim() || null
            };

            try {
                const url = id ? `${API_BASE}/${id}` : API_BASE;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(metricData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(id ? '更新成功' : '创建成功', 'success');
                    resetForm();
                    loadMetrics();
                } else {
                    showMessage('操作失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        });

        // 页面加载时获取数据
        window.addEventListener('load', async function() {
            updateSqlFieldsRequired();
            await checkLogin();
            if (currentUser) {
                await loadTopics();
                loadMetrics();
                updateUI();
            }
        });
        
        // 检查登录状态
        async function checkLogin() {
            try {
                const response = await fetch(`${AUTH_API}/current`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.data;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                } else {
                    // 未登录,跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                window.location.href = 'login.html';
            }
        }
        
        // 加载主题列表
        async function loadTopics() {
            try {
                const response = await fetch(TOPIC_API, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    allTopics = result.data;
                    
                    // 填充表单中的主题选择器
                    const topicSelect = document.getElementById('topicId');
                    topicSelect.innerHTML = '<option value="">请选择主题</option>' + 
                        allTopics.map(topic => `<option value="${topic.id}">${topic.topicName}</option>`).join('');
                    
                    // 填充导航栏中的主题选择器
                    const navTopicSelect = document.getElementById('topicSelect');
                    navTopicSelect.innerHTML = '<option value="">所有主题</option>' + 
                        allTopics.map(topic => `<option value="${topic.id}">${topic.topicName}</option>`).join('');
                    
                    // 监听主题筛选
                    navTopicSelect.addEventListener('change', function() {
                        const topicId = this.value;
                        if (topicId) {
                            loadMetricsByTopic(topicId);
                        } else {
                            loadMetrics();
                        }
                    });
                }
            } catch (error) {
                console.error('加载主题失败:', error);
            }
        }
        
        // 根据主题加载指标
        async function loadMetricsByTopic(topicId) {
            try {
                const response = await fetch(`${API_BASE}/topic/${topicId}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderMetricTable(result.data);
                } else {
                    showMessage('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 更新UI
        function updateUI() {
            if (!currentUser) return;
            
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('currentUser').textContent = 
                `${currentUser.realName || currentUser.username} (${getRoleText(currentUser.role)})`;
            
            // 显示管理员链接
            if (currentUser.role === 'SUPER_ADMIN') {
                document.getElementById('adminLink').style.display = 'inline';
            }
            
            // 控制表单显示
            if (!canEdit()) {
                document.querySelector('.form-section').style.display = 'none';
                showMessage('您当前只有查看权限，如需编辑请联系管理员', 'error');
            }
        }
        
        // 获取角色文本
        function getRoleText(role) {
            const roleMap = {
                'SUPER_ADMIN': '超级管理员',
                'TOPIC_ADMIN': '主题管理员',
                'USER': '普通用户'
            };
            return roleMap[role] || role;
        }
        
        // 检查是否有编辑权限
        function canEdit() {
            if (!currentUser) return false;
            return currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'TOPIC_ADMIN';
        }
        
        // 退出登录
        async function logout() {
            try {
                await fetch(`${AUTH_API}/logout`, { 
                    method: 'POST',
                    credentials: 'include'
                });
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('退出失败:', error);
            }
        }

    </script>
</body>
</html>
