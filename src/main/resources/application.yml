server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://192.168.31.100:5432/vectordb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

sqldm:
  metric-code-pattern: "^[A-Z][A-Z0-9_]{2,49}$"
  metric-code-pattern-enabled: true
  webhook:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
